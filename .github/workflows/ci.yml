name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      - run: docker build -t reservix .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
  integracion:
    runs-on: ubuntu-24.04
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - run: ./ops/ci-integracion.sh
      - if: failure()
        run: docker compose logs --no-color --tail=100
